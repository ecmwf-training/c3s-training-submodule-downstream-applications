version: 1
project:
  title: Jupyterbook template
  authors:
    - name: The Copernicus Climate Change Service (C3S)
    - name: entrusted to ECMWF (European Centre for Medium-Range Weather Forecasts)
  exclude:
    - developer/*
  github: ecmwf-training/jupyter-template
  thebe:
    binder:
      repo: ecmwf-training/jupyter-template
      provider: github
      url: https://mybinder.org
      ref: develop
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: intro.md
    - file: exclusion-layers.ipynb
    - file: wind-scaling-alpha.ipynb
site:
  options:
    folders: true
  template: book-theme
